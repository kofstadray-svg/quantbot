# docker-compose.yml — Trading bot service stack
#
# Prerequisites:
#   - Docker Desktop with WSL2 backend (Windows) or Docker Engine (Linux)
#   - Copy .env.example to .env and fill in credentials
#
# Start all services:
#   docker compose up -d
#
# View logs:
#   docker compose logs -f bot
#
# Stop everything:
#   docker compose down

version: "3.9"

# ── Shared config ──────────────────────────────────────────────────────────────
x-bot-base: &bot-base
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env
  restart: unless-stopped
  volumes:
    - logs:/app/logs        # shared log volume (all services write here)
  networks:
    - botnet

# ── Services ───────────────────────────────────────────────────────────────────
services:

  # Main scheduler bot — runs the full scan+trade loop on schedule
  bot:
    <<: *bot-base
    container_name: trading-bot
    command: python main.py
    ports:
      - "9102:9102"         # /health  /ready  /metrics
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9102/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # TradingView alert → Alpaca order bridge
  webhook:
    <<: *bot-base
    container_name: trading-webhook
    command: python webhook_server.py
    ports:
      - "8080:8080"         # TradingView POSTs here
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Telegram command bot
  telegram:
    <<: *bot-base
    container_name: trading-telegram
    command: python telegram_bot.py
    ports:
      - "9100:9100"         # /health  /ready  /metrics
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9100/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# ── Volumes & networks ────────────────────────────────────────────────────────
volumes:
  logs:                     # named volume → survives container restarts

networks:
  botnet:
    driver: bridge
